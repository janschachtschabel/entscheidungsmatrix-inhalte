<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="1000" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1100" height="60" fill="url(#headerGrad)"/>
  <text x="550" y="25" text-anchor="middle" fill="white" font-size="20" font-weight="bold">STUFE 3: Use-Case Auskunft</text>
  <text x="550" y="45" text-anchor="middle" fill="#e9d5ff" font-size="11">Tags aus Stufe 1+2 mit Matrix abgleichen → Pool zuweisen → Ergebnis</text>
  
  <!-- Start: Input Tags -->
  <ellipse cx="550" cy="100" rx="120" ry="25" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="550" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">INPUT: Tags aus Stufe 1+2</text>
  
  <line x1="550" y1="125" x2="550" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Tag Overview Box -->
  <rect x="150" y="165" width="800" height="80" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="170" y="188" fill="#6b21a8" font-size="11" font-weight="bold">Gesetzte Tags prüfen:</text>
  
  <text x="170" y="210" fill="#dc2626" font-size="9" font-weight="bold">BLOCK:</text>
  <text x="220" y="210" fill="#475569" font-size="8">UNCOOP | PII_QUARANTINE | PLATFORM_NO_OPTIN | RIGHTS_UNKNOWN | LICENSE_UNKNOWN | TOS_AI | TOS_REDIST | TDM_OPTOUT</text>
  
  <text x="170" y="228" fill="#f59e0b" font-size="9" font-weight="bold">LIMIT:</text>
  <text x="215" y="228" fill="#475569" font-size="8">NC_ONLY | DISPLAY_ONLY | MIXED_TREAT_AS_UNKNOWN | CRAWL_DISALLOWED | DB_RISK_COMM</text>
  
  <line x1="550" y1="245" x2="550" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 1: Pool -->
  <rect x="350" y="280" width="400" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="370" y="300" fill="#6b21a8" font-size="12" font-weight="bold">Schritt 1: Pool-Zuordnung (erster Treffer)</text>
  
  <line x1="550" y1="310" x2="550" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pool Priority Flow -->
  <rect x="100" y="350" width="900" height="100" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  
  <!-- Z0 -->
  <rect x="120" y="370" width="120" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="392" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">Z0 BLOCK</text>
  <text x="180" y="408" text-anchor="middle" fill="#dc2626" font-size="8">BLOCK.UNCOOP</text>
  <text x="180" y="422" text-anchor="middle" fill="#dc2626" font-size="7">⛔ Alle = 🔴</text>
  
  <line x1="240" y1="400" x2="270" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Z1 -->
  <rect x="270" y="370" width="120" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="330" y="392" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">Z1 QUARANTINE</text>
  <text x="330" y="408" text-anchor="middle" fill="#dc2626" font-size="8">BLOCK.PII_QUAR</text>
  <text x="330" y="422" text-anchor="middle" fill="#dc2626" font-size="7">⛔ Alle = 🔴</text>
  
  <line x1="390" y1="400" x2="420" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Z2 -->
  <rect x="420" y="370" width="120" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="392" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">Z2 PLATFORM</text>
  <text x="480" y="408" text-anchor="middle" fill="#92400e" font-size="8">PLATFORM_NO_OPTIN</text>
  <text x="480" y="422" text-anchor="middle" fill="#92400e" font-size="7">🟡 Alle = 🔴</text>
  
  <line x1="540" y1="400" x2="570" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Z3 -->
  <rect x="570" y="370" width="120" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="392" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">Z3 NC</text>
  <text x="630" y="408" text-anchor="middle" fill="#92400e" font-size="8">LIMIT.NC_ONLY</text>
  <text x="630" y="422" text-anchor="middle" fill="#92400e" font-size="7">🟡 Kein COMM</text>
  
  <line x1="690" y1="400" x2="720" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Z5 -->
  <rect x="720" y="370" width="120" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="780" y="392" text-anchor="middle" fill="#3730a3" font-size="10" font-weight="bold">Z5 UNKLAR</text>
  <text x="780" y="408" text-anchor="middle" fill="#3730a3" font-size="8">source=UNKNOWN</text>
  <text x="780" y="422" text-anchor="middle" fill="#3730a3" font-size="7">❓ Klärung nötig</text>
  
  <line x1="840" y1="400" x2="870" y2="400" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Z4 -->
  <rect x="870" y="370" width="110" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="925" y="392" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">Z4 SAFE</text>
  <text x="925" y="408" text-anchor="middle" fill="#166534" font-size="8">Keine Blocker</text>
  <text x="925" y="422" text-anchor="middle" fill="#166534" font-size="7">✅ Alle = 🟢</text>
  
  <line x1="550" y1="450" x2="550" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Matrix -->
  <rect x="350" y="485" width="400" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="370" y="505" fill="#6b21a8" font-size="12" font-weight="bold">Schritt 2: Matrix ausfüllen (Tag-Abgleich)</text>
  
  <line x1="550" y1="515" x2="550" y2="545" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Matrix with Tags -->
  <rect x="50" y="555" width="1000" height="320" rx="8" fill="white" stroke="#c4b5fd" stroke-width="2"/>
  <text x="550" y="580" text-anchor="middle" fill="#6b21a8" font-size="13" font-weight="bold">ENTSCHEIDUNGSMATRIX: Komponenten × Use Cases</text>
  
  <!-- Header Row -->
  <rect x="70" y="595" width="130" height="30" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="135" y="615" text-anchor="middle" fill="#6b21a8" font-size="10" font-weight="bold">Komponente</text>
  
  <rect x="200" y="595" width="120" height="30" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="260" y="615" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="bold">SEARCH_DISPLAY</text>
  
  <rect x="320" y="595" width="120" height="30" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="380" y="615" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="bold">TRAIN_INT</text>
  
  <rect x="440" y="595" width="120" height="30" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="500" y="615" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="bold">TRAIN_EXT</text>
  
  <rect x="560" y="595" width="120" height="30" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="620" y="615" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="bold">DATASET_NC</text>
  
  <rect x="680" y="595" width="120" height="30" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="740" y="615" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="bold">DATASET_COMM</text>
  
  <rect x="800" y="595" width="120" height="30" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="860" y="615" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="bold">MODEL_SHARE</text>
  
  <!-- GLOBAL Row -->
  <rect x="70" y="625" width="130" height="35" fill="#fef2f2" stroke="#fecaca"/>
  <text x="135" y="645" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">GLOBAL</text>
  <text x="200" y="645" fill="#dc2626" font-size="7">PII_QUAR, UNCOOP</text>
  <text x="320" y="645" fill="#dc2626" font-size="7">PII_QUAR, UNCOOP</text>
  <text x="440" y="645" fill="#dc2626" font-size="7">PII_QUAR, UNCOOP</text>
  <text x="560" y="645" fill="#dc2626" font-size="7">PII_QUAR, UNCOOP</text>
  <text x="680" y="645" fill="#dc2626" font-size="7">PII_QUAR, UNCOOP</text>
  <text x="800" y="645" fill="#dc2626" font-size="7">PII_QUAR, UNCOOP</text>
  
  <!-- FACTS Row -->
  <rect x="70" y="660" width="130" height="35" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="135" y="680" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">FACTS</text>
  <text x="200" y="675" fill="#475569" font-size="6">PLATFORM_NO_OPTIN</text>
  <text x="320" y="675" fill="#475569" font-size="6">PLATFORM, TOS_AI</text>
  <text x="320" y="685" fill="#475569" font-size="6">TDM_OPTOUT</text>
  <text x="440" y="675" fill="#475569" font-size="6">PLATFORM, TOS_AI</text>
  <text x="440" y="685" fill="#475569" font-size="6">TDM_OPTOUT</text>
  <text x="560" y="675" fill="#475569" font-size="6">PLATFORM</text>
  <text x="560" y="685" fill="#475569" font-size="6">TOS_REDIST</text>
  <text x="680" y="675" fill="#475569" font-size="6">+NC_ONLY</text>
  <text x="680" y="685" fill="#f59e0b" font-size="6">+DB_RISK_COMM</text>
  <text x="800" y="675" fill="#475569" font-size="6">PLATFORM, TOS_AI</text>
  <text x="800" y="685" fill="#475569" font-size="6">TDM, TOS_REDIST</text>
  
  <!-- TEXT Row -->
  <rect x="70" y="695" width="130" height="40" fill="#fefce8" stroke="#fef08a"/>
  <text x="135" y="718" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">TEXT</text>
  <text x="200" y="710" fill="#475569" font-size="6">PLATFORM, RIGHTS</text>
  <text x="200" y="720" fill="#475569" font-size="6">LICENSE_UNK</text>
  <text x="200" y="730" fill="#f59e0b" font-size="6">DISPLAY_ONLY</text>
  <text x="320" y="710" fill="#475569" font-size="6">PLATFORM, RIGHTS</text>
  <text x="320" y="720" fill="#475569" font-size="6">LICENSE, TOS_AI</text>
  <text x="320" y="730" fill="#f59e0b" font-size="6">NC_ONLY</text>
  <text x="440" y="710" fill="#475569" font-size="6">PLATFORM, RIGHTS</text>
  <text x="440" y="720" fill="#475569" font-size="6">LICENSE, TOS_AI</text>
  <text x="440" y="730" fill="#f59e0b" font-size="6">NC_ONLY</text>
  <text x="560" y="710" fill="#475569" font-size="6">PLATFORM, RIGHTS</text>
  <text x="560" y="720" fill="#475569" font-size="6">LICENSE, REDIST</text>
  <text x="560" y="730" fill="#f59e0b" font-size="6">NC_ONLY</text>
  <text x="680" y="710" fill="#475569" font-size="6">PLATFORM, RIGHTS</text>
  <text x="680" y="720" fill="#475569" font-size="6">LICENSE, REDIST</text>
  <text x="680" y="730" fill="#f59e0b" font-size="6">NC_ONLY</text>
  <text x="800" y="710" fill="#475569" font-size="6">PLATFORM, RIGHTS</text>
  <text x="800" y="720" fill="#475569" font-size="6">LICENSE, TOS_AI</text>
  <text x="800" y="730" fill="#f59e0b" font-size="6">TDM, REDIST, NC</text>
  
  <!-- MEDIA Row -->
  <rect x="70" y="735" width="130" height="40" fill="#fefce8" stroke="#fef08a"/>
  <text x="135" y="758" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">MEDIA</text>
  <text x="200" y="755" fill="#475569" font-size="6">(wie TEXT)</text>
  <text x="320" y="755" fill="#475569" font-size="6">(wie TEXT)</text>
  <text x="440" y="755" fill="#475569" font-size="6">(wie TEXT)</text>
  <text x="560" y="755" fill="#475569" font-size="6">(wie TEXT)</text>
  <text x="680" y="755" fill="#475569" font-size="6">(wie TEXT)</text>
  <text x="800" y="755" fill="#475569" font-size="6">(wie TEXT)</text>
  
  <!-- Derivate Row -->
  <rect x="70" y="775" width="130" height="35" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="135" y="790" text-anchor="middle" fill="#5b21b6" font-size="9" font-weight="bold">DERIVATE</text>
  <text x="135" y="802" text-anchor="middle" fill="#7c3aed" font-size="7">COMP/QA/IDX/MODEL</text>
  <text x="350" y="795" fill="#5b21b6" font-size="8">→ Erben alle Tags vom Ursprungsmaterial (TEXT/MEDIA/MIXED)</text>
  
  <!-- Legend -->
  <rect x="70" y="820" width="850" height="45" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="90" y="840" fill="#475569" font-size="9" font-weight="bold">Legende:</text>
  <text x="160" y="840" fill="#dc2626" font-size="9">BLOCK.* → 🔴 blockiert</text>
  <text x="310" y="840" fill="#f59e0b" font-size="9">LIMIT.* → 🟡 bedingt</text>
  <text x="460" y="840" fill="#22c55e" font-size="9">Keine Tags → 🟢 erlaubt</text>
  <text x="620" y="840" fill="#3b82f6" font-size="9">REQ.* = Auflage bei Nutzung</text>
  <text x="90" y="858" fill="#64748b" font-size="8">Auflagen: REQ.ATTRIBUTION (Quellenangabe) | REQ.LINK_ONLY (nur verlinken)</text>
  
  <!-- Arrow to Output -->
  <line x1="550" y1="875" x2="550" y2="905" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- OUTPUT -->
  <rect x="300" y="915" width="500" height="55" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="550" y="940" text-anchor="middle" fill="white" font-size="14" font-weight="bold">OUTPUT: Entscheidungsmatrix + Pool</text>
  <text x="550" y="960" text-anchor="middle" fill="#e9d5ff" font-size="10">7 Komponenten × 6 Use Cases | Pool-Zuordnung | Auflagen</text>
</svg>
