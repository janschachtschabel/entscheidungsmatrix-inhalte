<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="900" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="60" fill="url(#headerGrad)"/>
  <text x="500" y="25" text-anchor="middle" fill="white" font-size="20" font-weight="bold">STUFE 3: Entscheidungsmatrix</text>
  <text x="500" y="45" text-anchor="middle" fill="#e9d5ff" font-size="11">Tags auslesen → Pool zuweisen → Matrix ausgeben (keine neue Bewertung!)</text>
  
  <!-- Start -->
  <ellipse cx="500" cy="100" rx="100" ry="25" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="500" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">INPUT: Tags aus Stufe 1+2</text>
  
  <!-- Arrow -->
  <line x1="500" y1="125" x2="500" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pool Priority Check -->
  <rect x="300" y="165" width="400" height="35" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="320" y="185" fill="#6b21a8" font-size="12" font-weight="bold">Schritt 1: Pool-Zuordnung (Priorität)</text>
  
  <line x1="500" y1="200" x2="500" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Priority Chain -->
  <rect x="80" y="240" width="840" height="200" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  
  <!-- Prio 1: Z0 -->
  <polygon points="180,270 260,300 180,330 100,300" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="298" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="bold">BLOCK.</text>
  <text x="180" y="312" text-anchor="middle" fill="#dc2626" font-size="8">UNCOOP?</text>
  
  <line x1="260" y1="300" x2="300" y2="300" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="280" y="292" fill="#dc2626" font-size="8">JA</text>
  
  <rect x="300" y="280" width="80" height="40" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="340" y="302" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">Z0 BLOCK</text>
  <text x="340" y="315" text-anchor="middle" fill="#dc2626" font-size="7">Alle 🔴</text>
  
  <!-- Prio 2: Z1 -->
  <line x1="180" y1="330" x2="180" y2="360" stroke="#64748b" stroke-width="1"/>
  <polygon points="180,360 260,390 180,420 100,390" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="388" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="bold">BLOCK.PII</text>
  <text x="180" y="402" text-anchor="middle" fill="#dc2626" font-size="8">QUARANTINE?</text>
  
  <line x1="260" y1="390" x2="300" y2="390" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="300" y="370" width="80" height="40" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="340" y="392" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">Z1 QUAR</text>
  <text x="340" y="405" text-anchor="middle" fill="#dc2626" font-size="7">Alle 🔴</text>
  
  <!-- Prio 3: Z2 -->
  <polygon points="450,270 530,300 450,330 370,300" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="298" text-anchor="middle" fill="#92400e" font-size="9" font-weight="bold">BLOCK.</text>
  <text x="450" y="312" text-anchor="middle" fill="#92400e" font-size="7">PLATFORM?</text>
  
  <line x1="530" y1="300" x2="570" y2="300" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="570" y="280" width="90" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="615" y="302" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">Z2 PLAT</text>
  <text x="615" y="315" text-anchor="middle" fill="#92400e" font-size="7">Nur SEARCH</text>
  
  <!-- Prio 4: Z3 -->
  <line x1="450" y1="330" x2="450" y2="360" stroke="#64748b" stroke-width="1"/>
  <polygon points="450,360 530,390 450,420 370,390" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="388" text-anchor="middle" fill="#92400e" font-size="9" font-weight="bold">LIMIT.</text>
  <text x="450" y="402" text-anchor="middle" fill="#92400e" font-size="8">NC_ONLY?</text>
  
  <line x1="530" y1="390" x2="570" y2="390" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="570" y="370" width="90" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="615" y="392" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">Z3 NC</text>
  <text x="615" y="405" text-anchor="middle" fill="#92400e" font-size="7">Kein COMM</text>
  
  <!-- Prio 5: Z5 -->
  <polygon points="720,270 800,300 720,330 640,300" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="720" y="298" text-anchor="middle" fill="#3730a3" font-size="9" font-weight="bold">source</text>
  <text x="720" y="312" text-anchor="middle" fill="#3730a3" font-size="8">UNKNOWN?</text>
  
  <line x1="800" y1="300" x2="840" y2="300" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="840" y="280" width="70" height="40" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="875" y="302" text-anchor="middle" fill="#3730a3" font-size="10" font-weight="bold">Z5</text>
  <text x="875" y="315" text-anchor="middle" fill="#3730a3" font-size="7">UNKLAR</text>
  
  <!-- Prio 6: Z4 -->
  <line x1="720" y1="330" x2="720" y2="360" stroke="#64748b" stroke-width="1"/>
  <rect x="680" y="370" width="80" height="40" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="720" y="392" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">Z4 SAFE</text>
  <text x="720" y="405" text-anchor="middle" fill="#166534" font-size="7">Alle 🟢</text>
  
  <!-- Arrow to Step 2 -->
  <line x1="500" y1="440" x2="500" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Matrix Fill -->
  <rect x="300" y="480" width="400" height="35" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="320" y="500" fill="#6b21a8" font-size="12" font-weight="bold">Schritt 2: Matrix ausfüllen</text>
  
  <line x1="500" y1="515" x2="500" y2="545" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Matrix Preview -->
  <rect x="100" y="555" width="800" height="180" rx="8" fill="white" stroke="#c4b5fd" stroke-width="2"/>
  <text x="500" y="580" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="bold">ENTSCHEIDUNGSMATRIX</text>
  
  <!-- Header Row -->
  <rect x="120" y="595" width="100" height="25" fill="#f3e8ff"/>
  <text x="170" y="612" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="bold">Komponente</text>
  
  <rect x="220" y="595" width="80" height="25" fill="#f3e8ff"/>
  <text x="260" y="612" text-anchor="middle" fill="#6b21a8" font-size="8" font-weight="bold">SEARCH</text>
  
  <rect x="300" y="595" width="80" height="25" fill="#f3e8ff"/>
  <text x="340" y="612" text-anchor="middle" fill="#6b21a8" font-size="8" font-weight="bold">TRAIN_INT</text>
  
  <rect x="380" y="595" width="80" height="25" fill="#f3e8ff"/>
  <text x="420" y="612" text-anchor="middle" fill="#6b21a8" font-size="8" font-weight="bold">TRAIN_EXT</text>
  
  <rect x="460" y="595" width="80" height="25" fill="#f3e8ff"/>
  <text x="500" y="612" text-anchor="middle" fill="#6b21a8" font-size="8" font-weight="bold">DS_NC</text>
  
  <rect x="540" y="595" width="80" height="25" fill="#f3e8ff"/>
  <text x="580" y="612" text-anchor="middle" fill="#6b21a8" font-size="8" font-weight="bold">DS_COMM</text>
  
  <rect x="620" y="595" width="80" height="25" fill="#f3e8ff"/>
  <text x="660" y="612" text-anchor="middle" fill="#6b21a8" font-size="8" font-weight="bold">MODEL</text>
  
  <!-- Sample Rows -->
  <text x="170" y="640" text-anchor="middle" fill="#475569" font-size="9">FACTS</text>
  <text x="260" y="640" text-anchor="middle" fill="#22c55e" font-size="10">🟢</text>
  <text x="340" y="640" text-anchor="middle" fill="#22c55e" font-size="10">🟢</text>
  <text x="420" y="640" text-anchor="middle" fill="#22c55e" font-size="10">🟢</text>
  <text x="500" y="640" text-anchor="middle" fill="#22c55e" font-size="10">🟢</text>
  <text x="580" y="640" text-anchor="middle" fill="#f59e0b" font-size="10">🟡</text>
  <text x="660" y="640" text-anchor="middle" fill="#f59e0b" font-size="10">🟡</text>
  
  <text x="170" y="665" text-anchor="middle" fill="#475569" font-size="9">TEXT</text>
  <text x="260" y="665" text-anchor="middle" fill="#22c55e" font-size="10">🟢</text>
  <text x="340" y="665" text-anchor="middle" fill="#f59e0b" font-size="10">🟡</text>
  <text x="420" y="665" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  <text x="500" y="665" text-anchor="middle" fill="#f59e0b" font-size="10">🟡</text>
  <text x="580" y="665" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  <text x="660" y="665" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  
  <text x="170" y="690" text-anchor="middle" fill="#475569" font-size="9">MEDIA</text>
  <text x="260" y="690" text-anchor="middle" fill="#f59e0b" font-size="10">🟡</text>
  <text x="340" y="690" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  <text x="420" y="690" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  <text x="500" y="690" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  <text x="580" y="690" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  <text x="660" y="690" text-anchor="middle" fill="#dc2626" font-size="10">🔴</text>
  
  <text x="170" y="715" text-anchor="middle" fill="#475569" font-size="8">+ Derivate...</text>
  
  <!-- Legend in Matrix -->
  <rect x="720" y="625" width="160" height="95" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="800" y="645" text-anchor="middle" fill="#475569" font-size="9" font-weight="bold">Zell-Regel</text>
  <text x="730" y="665" fill="#dc2626" font-size="8">BLOCK.* → 🔴</text>
  <text x="730" y="680" fill="#f59e0b" font-size="8">LIMIT.* → 🟡</text>
  <text x="730" y="695" fill="#22c55e" font-size="8">Keine Tags → 🟢</text>
  <text x="730" y="715" fill="#3b82f6" font-size="7">REQ.* = Auflage</text>
  
  <!-- Arrow to Output -->
  <line x1="500" y1="735" x2="500" y2="765" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- OUTPUT -->
  <rect x="250" y="775" width="500" height="50" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="500" y="800" text-anchor="middle" fill="white" font-size="14" font-weight="bold">OUTPUT: Entscheidungsmatrix</text>
  <text x="500" y="817" text-anchor="middle" fill="#e9d5ff" font-size="10">7 Komponenten × 6 Use Cases = 42 Zellen</text>
  
  <!-- Pool Legend -->
  <rect x="20" y="100" width="120" height="130" rx="6" fill="white" stroke="#e2e8f0"/>
  <text x="30" y="120" fill="#475569" font-size="9" font-weight="bold">Pools</text>
  <text x="30" y="140" fill="#dc2626" font-size="8">Z0 BLOCK</text>
  <text x="30" y="155" fill="#dc2626" font-size="8">Z1 QUARANTINE</text>
  <text x="30" y="170" fill="#f59e0b" font-size="8">Z2 PLATFORM</text>
  <text x="30" y="185" fill="#f59e0b" font-size="8">Z3 NC</text>
  <text x="30" y="200" fill="#22c55e" font-size="8">Z4 SAFE</text>
  <text x="30" y="215" fill="#6366f1" font-size="8">Z5 UNKLAR</text>
</svg>
