<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="1400" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="80" fill="url(#headerGrad2)"/>
  <text x="500" y="35" text-anchor="middle" fill="white" font-size="24" font-weight="bold">STUFE 2: Rechte &amp; Policies</text>
  <text x="500" y="60" text-anchor="middle" fill="#d1fae5" font-size="14">Kernprüfung – Tag-Vergabe für Use-Cases</text>
  
  <!-- Input from Stufe 1 -->
  <rect x="350" y="100" width="300" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="500" y="130" text-anchor="middle" fill="#3730a3" font-size="13" font-weight="bold">INPUT: Datenpass aus Stufe 1</text>
  
  <!-- Arrow -->
  <line x1="500" y1="150" x2="500" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Gate 2A: Harte Ausschlüsse -->
  <rect x="50" y="190" width="900" height="180" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="500" y="220" text-anchor="middle" fill="#dc2626" font-size="16" font-weight="bold">GATE 2A: Harte Ausschlüsse (zuerst prüfen!)</text>
  
  <!-- Q1: Unkooperativ -->
  <polygon points="200,270 300,310 200,350 100,310" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="305" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">UNCOOP?</text>
  <text x="200" y="320" text-anchor="middle" fill="#92400e" font-size="9">(robots/ToS</text>
  <text x="200" y="332" text-anchor="middle" fill="#92400e" font-size="9">umgangen)</text>
  
  <line x1="100" y1="310" x2="50" y2="310" stroke="#64748b" stroke-width="2"/>
  <text x="75" y="300" fill="#dc2626" font-size="9" font-weight="bold">JA</text>
  <rect x="10" y="285" width="40" height="50" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="30" y="315" text-anchor="middle" fill="#dc2626" font-size="18">🔴</text>
  
  <!-- Q2: Platform ohne Opt-in -->
  <polygon points="500,270 620,310 500,350 380,310" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="300" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">PLATFORM</text>
  <text x="500" y="315" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">ohne Opt-in?</text>
  
  <line x1="380" y1="310" x2="330" y2="310" stroke="#64748b" stroke-width="2"/>
  <text x="355" y="300" fill="#f59e0b" font-size="9" font-weight="bold">JA</text>
  <rect x="310" y="285" width="40" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="330" y="315" text-anchor="middle" fill="#f59e0b" font-size="18">🟡</text>
  
  <!-- Blocker Tags Box -->
  <rect x="680" y="250" width="250" height="100" rx="8" fill="white" stroke="#ef4444" stroke-width="1"/>
  <text x="805" y="275" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">Blocker-Tags setzen:</text>
  <text x="695" y="295" fill="#dc2626" font-size="10">• BLOCK.UNCOOP → alle Use-Cases 🔴</text>
  <text x="695" y="310" fill="#dc2626" font-size="10">• BLOCK.PLATFORM_NO_OPTIN</text>
  <text x="700" y="325" fill="#dc2626" font-size="10">  → TRAIN/DS/MODEL 🔴, SEARCH 🟡</text>
  <text x="695" y="340" fill="#dc2626" font-size="10">• REQ.LINK_ONLY bei MEDIA</text>
  
  <!-- Arrow down -->
  <line x1="500" y1="370" x2="500" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Gate 2B: Rechtebasis -->
  <rect x="50" y="410" width="900" height="120" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="500" y="440" text-anchor="middle" fill="#a16207" font-size="16" font-weight="bold">GATE 2B: Rechtebasis der Quelle</text>
  
  <polygon points="300,480 420,510 300,540 180,510" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="505" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">Rechteinhaber?</text>
  <text x="300" y="520" text-anchor="middle" fill="#92400e" font-size="9">(oder berechtigt)</text>
  
  <rect x="480" y="475" width="180" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="570" y="495" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">JA → weiter prüfen</text>
  <text x="570" y="510" text-anchor="middle" fill="#166534" font-size="9">(kein Blocker)</text>
  
  <rect x="700" y="475" width="230" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="815" y="495" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">NEIN/Unklar → BLOCK.RIGHTS_UNKNOWN</text>
  <text x="815" y="510" text-anchor="middle" fill="#dc2626" font-size="9">TEXT/MEDIA/DERIVED alle 🔴</text>
  
  <!-- Arrow -->
  <line x1="500" y1="530" x2="500" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Gate 2C: Vertrag -->
  <rect x="50" y="570" width="900" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="600" text-anchor="middle" fill="#1d4ed8" font-size="16" font-weight="bold">GATE 2C: Vertrag/Kooperation (falls vorhanden)</text>
  
  <polygon points="200,650 300,680 200,710 100,680" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="675" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">Vertrag</text>
  <text x="200" y="690" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">verbietet KI?</text>
  
  <polygon points="450,650 550,680 450,710 350,680" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="675" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">Vertrag verbietet</text>
  <text x="450" y="690" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">Weitergabe?</text>
  
  <rect x="650" y="640" width="280" height="60" rx="6" fill="white" stroke="#3b82f6" stroke-width="1"/>
  <text x="790" y="660" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="bold">Bei JA entsprechende Tags:</text>
  <text x="660" y="680" fill="#1d4ed8" font-size="10">• BLOCK.TOS_AI → TRAIN/MODEL 🔴</text>
  <text x="660" y="695" fill="#1d4ed8" font-size="10">• BLOCK.TOS_REDIST → DS_NC/DS_COMM 🔴</text>
  
  <!-- Arrow -->
  <line x1="500" y1="710" x2="500" y2="740" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Gate 2D: Lizenz -->
  <rect x="50" y="750" width="900" height="170" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="780" text-anchor="middle" fill="#166534" font-size="16" font-weight="bold">GATE 2D: Lizenz (je Komponente TEXT/MEDIA)</text>
  
  <polygon points="200,830 310,865 200,900 90,865" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="860" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">Lizenz bekannt</text>
  <text x="200" y="875" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">&amp; belegt?</text>
  
  <!-- License Matrix -->
  <rect x="380" y="810" width="570" height="100" rx="6" fill="white" stroke="#22c55e" stroke-width="1"/>
  <text x="665" y="830" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">Lizenz-Matrix:</text>
  <text x="400" y="850" fill="#166534" font-size="10">CC0/PD: alle 🟢 | CC BY: 🟢 + REQ.ATTRIBUTION</text>
  <text x="400" y="870" fill="#166534" font-size="10">CC BY-NC: 🟢 SEARCH/DS_NC, 🔴 DS_COMM/MODEL + LIMIT.NC_ONLY</text>
  <text x="400" y="890" fill="#166534" font-size="10">Proprietär: 🟡 mit Vertrag, sonst 🔴 | Unbekannt: BLOCK.LICENSE_UNKNOWN → TEXT/MEDIA 🔴</text>
  
  <!-- Arrow -->
  <line x1="500" y1="920" x2="500" y2="950" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Gate 2E: Opt-outs -->
  <rect x="50" y="960" width="900" height="140" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="500" y="990" text-anchor="middle" fill="#7e22ce" font-size="16" font-weight="bold">GATE 2E: Opt-outs &amp; Policies (ToS/robots/TDM)</text>
  
  <polygon points="180,1040 280,1070 180,1100 80,1070" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="180" y="1065" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">ToS verbietet</text>
  <text x="180" y="1080" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">KI?</text>
  
  <polygon points="400,1040 500,1070 400,1100 300,1070" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="1065" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">ToS verbietet</text>
  <text x="400" y="1080" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">Redist?</text>
  
  <polygon points="620,1040 720,1070 620,1100 520,1070" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="620" y="1065" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">TDM</text>
  <text x="620" y="1080" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">Opt-out?</text>
  
  <rect x="770" y="1030" width="170" height="60" rx="6" fill="white" stroke="#a855f7" stroke-width="1"/>
  <text x="855" y="1055" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="bold">JA-Tags:</text>
  <text x="855" y="1075" text-anchor="middle" fill="#7e22ce" font-size="9">BLOCK.TOS_AI/REDIST/TDM</text>
  
  <!-- Arrow -->
  <line x1="500" y1="1100" x2="500" y2="1130" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Gate 2F: DB-Recht -->
  <rect x="200" y="1140" width="600" height="80" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="500" y="1170" text-anchor="middle" fill="#c2410c" font-size="14" font-weight="bold">GATE 2F: Datenbankrecht (FACTS kommerziell)</text>
  <text x="500" y="1195" text-anchor="middle" fill="#c2410c" font-size="11">Systematischer Abruf ohne Vertrag? → LIMIT.DB_RISK_COMM → FACTS.DS_COMM 🔴</text>
  
  <!-- Arrow to output -->
  <line x1="500" y1="1220" x2="500" y2="1260" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Output -->
  <rect x="250" y="1270" width="500" height="70" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="500" y="1300" text-anchor="middle" fill="white" font-size="14" font-weight="bold">OUTPUT: Rights Profile (Tag-Set)</text>
  <text x="500" y="1320" text-anchor="middle" fill="#d1fae5" font-size="11">BLOCKER + LIMITS + REQ + Use-Case-Tags pro Komponente</text>
  <text x="500" y="1335" text-anchor="middle" fill="#d1fae5" font-size="11">→ Weiter zu STUFE 3 (Use-Case Auskunft)</text>
  
  <!-- Legend -->
  <rect x="20" y="1270" width="200" height="100" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="1290" fill="#475569" font-size="11" font-weight="bold">Tag-Typen:</text>
  <text x="30" y="1310" fill="#dc2626" font-size="10">BLOCK.* = sperrt Use-Cases</text>
  <text x="30" y="1325" fill="#f59e0b" font-size="10">LIMIT.* = schränkt ein</text>
  <text x="30" y="1340" fill="#3b82f6" font-size="10">REQ.* = Pflicht-Auflagen</text>
  <text x="30" y="1355" fill="#22c55e" font-size="10">K.USE_CASE = 🟢/🟡/🔴</text>
</svg>
