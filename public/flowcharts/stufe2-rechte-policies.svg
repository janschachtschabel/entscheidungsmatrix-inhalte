<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1300" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="1300" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1100" height="70" fill="url(#headerGrad)"/>
  <text x="550" y="28" text-anchor="middle" fill="white" font-size="22" font-weight="bold">STUFE 2: Rechte &amp; Policy</text>
  <text x="550" y="48" text-anchor="middle" fill="#d1fae5" font-size="12">Tags vergeben: BLOCK.* • LIMIT.* • REQ.*</text>
  <text x="550" y="64" text-anchor="middle" fill="#a7f3d0" font-size="10">Bei coop_present=yes: S2.3-S2.5 überspringen (Vertrag überschreibt)</text>
  
  <!-- Start -->
  <ellipse cx="550" cy="110" rx="100" ry="28" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="550" y="108" text-anchor="middle" fill="white" font-size="12" font-weight="bold">INPUT: Datenpass</text>
  <text x="550" y="122" text-anchor="middle" fill="#d1fae5" font-size="9">aus Stufe 1</text>
  
  <!-- Arrow -->
  <line x1="550" y1="138" x2="550" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pre-Check -->
  <polygon points="550,175 680,220 550,265 420,220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="215" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">Blocker aus S1?</text>
  <text x="550" y="230" text-anchor="middle" fill="#dc2626" font-size="8">UNCOOP/PII_QUARANTINE</text>
  
  <line x1="680" y1="220" x2="780" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="730" y="210" fill="#dc2626" font-size="9">JA</text>
  
  <rect x="780" y="195" width="130" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="845" y="218" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">⛔ Z0/Z1</text>
  <text x="845" y="235" text-anchor="middle" fill="#dc2626" font-size="8">STOPP!</text>
  
  <line x1="550" y1="265" x2="550" y2="295" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="565" y="285" fill="#166534" font-size="9">NEIN</text>
  
  <!-- OWN Check -->
  <polygon points="550,305 650,340 550,375 450,340" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="550" y="340" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">OWN?</text>
  
  <line x1="650" y1="340" x2="780" y2="340" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="715" y="330" fill="#166534" font-size="9">JA</text>
  
  <rect x="780" y="315" width="130" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="845" y="338" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">✅ Z4 SAFE</text>
  <text x="845" y="355" text-anchor="middle" fill="#166534" font-size="8">→ Stufe 3</text>
  
  <line x1="550" y1="375" x2="550" y2="405" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="565" y="395" fill="#475569" font-size="9">NEIN</text>
  
  <!-- ===== S2.1 HERKUNFTS-OVERRIDES ===== -->
  <rect x="350" y="415" width="400" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="370" y="435" fill="#1e40af" font-size="12" font-weight="bold">S2.1 Herkunfts- &amp; Plattform-Overrides</text>
  <text x="370" y="450" fill="#1e40af" font-size="9">S2-01: Unkooperativ? S2-02/03: PLATFORM Opt-in?</text>
  
  <line x1="550" y1="455" x2="550" y2="485" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Platform Check -->
  <polygon points="550,495 660,540 550,585 440,540" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="535" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">PLATFORM</text>
  <text x="550" y="550" text-anchor="middle" fill="#92400e" font-size="8">ohne Opt-in?</text>
  
  <line x1="660" y1="540" x2="780" y2="540" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="720" y="530" fill="#dc2626" font-size="9">JA</text>
  
  <rect x="780" y="510" width="180" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="870" y="533" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">BLOCK.PLATFORM_NO_OPTIN</text>
  <text x="870" y="550" text-anchor="middle" fill="#dc2626" font-size="8">→ Z2 PLATFORM</text>
  <text x="870" y="565" text-anchor="middle" fill="#dc2626" font-size="8">Nur SEARCH erlaubt</text>
  
  <line x1="550" y1="585" x2="550" y2="615" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="565" y="605" fill="#166534" font-size="9">NEIN</text>
  
  <!-- ===== S2.2 RECHTEKETTE ===== -->
  <rect x="350" y="625" width="400" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="370" y="645" fill="#1e40af" font-size="12" font-weight="bold">S2.2 Rechtekette / Rechteinhaber</text>
  <text x="370" y="657" fill="#1e40af" font-size="9">S2-04: Quelle berechtigt?</text>
  
  <line x1="550" y1="660" x2="550" y2="690" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Rights Check -->
  <polygon points="550,700 660,740 550,780 440,740" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="735" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">Rechte</text>
  <text x="550" y="750" text-anchor="middle" fill="#92400e" font-size="8">unklar?</text>
  
  <line x1="660" y1="740" x2="780" y2="740" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="720" y="730" fill="#dc2626" font-size="9">JA</text>
  
  <rect x="780" y="715" width="160" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="860" y="738" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">BLOCK.RIGHTS_UNKNOWN</text>
  <text x="860" y="755" text-anchor="middle" fill="#dc2626" font-size="8">TEXT/MEDIA = 🔴</text>
  
  <line x1="550" y1="780" x2="550" y2="810" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== COOP CHECK ===== -->
  <polygon points="550,820 650,855 550,890 450,855" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="550" y="850" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">coop_present</text>
  <text x="550" y="865" text-anchor="middle" fill="#166534" font-size="8">= yes?</text>
  
  <line x1="650" y1="855" x2="780" y2="855" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="715" y="845" fill="#166534" font-size="9">JA</text>
  
  <rect x="780" y="825" width="180" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="870" y="848" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">⏭️ S2.3-S2.5</text>
  <text x="870" y="865" text-anchor="middle" fill="#166534" font-size="9">überspringen!</text>
  <text x="870" y="880" text-anchor="middle" fill="#166534" font-size="8">Vertrag regelt Rechte</text>
  
  <line x1="550" y1="890" x2="550" y2="920" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="565" y="910" fill="#475569" font-size="9">NEIN</text>
  
  <!-- ===== S2.3-S2.5 Block (nur ohne COOP) ===== -->
  <rect x="200" y="930" width="700" height="180" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="220" y="955" fill="#0369a1" font-size="11" font-weight="bold">S2.3-S2.5: Nur wenn coop_present ≠ yes</text>
  
  <!-- S2.3 Lizenz -->
  <rect x="220" y="970" width="200" height="60" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="320" y="990" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">S2.3 Lizenz</text>
  <text x="320" y="1005" text-anchor="middle" fill="#1e40af" font-size="8">S2-05a/b: TEXT/MEDIA Lizenz?</text>
  <text x="320" y="1020" text-anchor="middle" fill="#dc2626" font-size="7">UNKNOWN → BLOCK.LICENSE_UNKNOWN</text>
  
  <!-- S2.4 ToS/TDM -->
  <rect x="450" y="970" width="200" height="60" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="550" y="990" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">S2.4 ToS/TDM</text>
  <text x="550" y="1005" text-anchor="middle" fill="#1e40af" font-size="8">S2-07/08/09/10: AGB, TDM?</text>
  <text x="550" y="1020" text-anchor="middle" fill="#dc2626" font-size="7">→ BLOCK.TOS_AI, BLOCK.TDM_OPTOUT</text>
  
  <!-- S2.5 DB-Recht -->
  <rect x="680" y="970" width="200" height="60" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="780" y="990" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">S2.5 DB-Recht</text>
  <text x="780" y="1005" text-anchor="middle" fill="#1e40af" font-size="8">S2-11: Massenentnahme?</text>
  <text x="780" y="1020" text-anchor="middle" fill="#f59e0b" font-size="7">→ LIMIT.DB_RISK_COMM</text>
  
  <!-- Limits Box -->
  <rect x="220" y="1040" width="660" height="55" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="550" y="1060" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">Mögliche LIMIT-Tags</text>
  <text x="550" y="1080" text-anchor="middle" fill="#92400e" font-size="9">LIMIT.NC_ONLY • LIMIT.DISPLAY_ONLY • LIMIT.MIXED_TREAT_AS_UNKNOWN • LIMIT.CRAWL_DISALLOWED</text>
  
  <!-- Arrow from COOP skip -->
  <line x1="960" y1="855" x2="1000" y2="855" stroke="#22c55e" stroke-width="1"/>
  <line x1="1000" y1="855" x2="1000" y2="1140" stroke="#22c55e" stroke-width="1"/>
  <line x1="1000" y1="1140" x2="600" y2="1140" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow down -->
  <line x1="550" y1="1110" x2="550" y2="1140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== S2.6 Derivate ===== -->
  <rect x="350" y="1150" width="400" height="35" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="370" y="1170" fill="#3730a3" font-size="12" font-weight="bold">S2.6 Derivate: Vererbungsregel</text>
  <text x="370" y="1182" fill="#3730a3" font-size="9">Derivate übernehmen alle Tags ihrer Basis</text>
  
  <!-- Arrow -->
  <line x1="550" y1="1185" x2="550" y2="1215" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- OUTPUT -->
  <rect x="300" y="1225" width="500" height="45" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="550" y="1250" text-anchor="middle" fill="white" font-size="14" font-weight="bold">OUTPUT: Tags → STUFE 3 Matrix</text>
  
  <!-- Legend -->
  <rect x="20" y="100" width="150" height="180" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="120" fill="#475569" font-size="10" font-weight="bold">BLOCK-Tags (🔴)</text>
  <text x="30" y="135" fill="#dc2626" font-size="8">BLOCK.UNCOOP</text>
  <text x="30" y="148" fill="#dc2626" font-size="8">BLOCK.PII_QUARANTINE</text>
  <text x="30" y="161" fill="#dc2626" font-size="8">BLOCK.PLATFORM_NO_OPTIN</text>
  <text x="30" y="174" fill="#dc2626" font-size="8">BLOCK.RIGHTS_UNKNOWN</text>
  <text x="30" y="187" fill="#dc2626" font-size="8">BLOCK.LICENSE_UNKNOWN</text>
  <text x="30" y="200" fill="#dc2626" font-size="8">BLOCK.TOS_AI/REDIST</text>
  <text x="30" y="213" fill="#dc2626" font-size="8">BLOCK.TDM_OPTOUT</text>
  <text x="30" y="235" fill="#475569" font-size="10" font-weight="bold">REQ-Tags</text>
  <text x="30" y="250" fill="#3b82f6" font-size="8">REQ.ATTRIBUTION</text>
  <text x="30" y="263" fill="#3b82f6" font-size="8">REQ.LINK_ONLY</text>
</svg>
