<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1500" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGrad)"/>
  <text x="600" y="28" text-anchor="middle" fill="white" font-size="22" font-weight="bold">STUFE 2: Rechte &amp; Policy</text>
  <text x="600" y="48" text-anchor="middle" fill="#d1fae5" font-size="12">Fragebogen S2-01 bis S2-12 → Tags vergeben: BLOCK.* • LIMIT.* • REQ.*</text>
  <text x="600" y="64" text-anchor="middle" fill="#a7f3d0" font-size="10">Bei coop_present=yes: S2.3-S2.5 überspringen (Vertrag überschreibt öffentliche Policies)</text>
  
  <!-- Start -->
  <ellipse cx="600" cy="110" rx="120" ry="28" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" fill="white" font-size="12" font-weight="bold">INPUT: Datenpass aus Stufe 1</text>
  <text x="600" y="122" text-anchor="middle" fill="#d1fae5" font-size="9">source_class, coop_present, components, pii_status</text>
  
  <line x1="600" y1="138" x2="600" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pre-Check: Blocker aus S1 -->
  <polygon points="600,175 730,220 600,265 470,220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="215" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">Blocker aus S1?</text>
  <text x="600" y="230" text-anchor="middle" fill="#dc2626" font-size="8">UNCOOP / PII_QUARANTINE</text>
  
  <line x1="730" y1="220" x2="850" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="790" y="210" fill="#dc2626" font-size="9">JA</text>
  
  <rect x="850" y="195" width="150" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="925" y="218" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="bold">⛔ Z0/Z1</text>
  <text x="925" y="235" text-anchor="middle" fill="#dc2626" font-size="9">STOPP!</text>
  
  <line x1="600" y1="265" x2="600" y2="295" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="615" y="285" fill="#166534" font-size="9">NEIN</text>
  
  <!-- OWN Check -->
  <polygon points="600,305 700,340 600,375 500,340" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="340" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">source_class = OWN?</text>
  
  <line x1="700" y1="340" x2="850" y2="340" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="775" y="330" fill="#166534" font-size="9">JA</text>
  
  <rect x="850" y="315" width="150" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="925" y="338" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">✅ Z4 SAFE</text>
  <text x="925" y="355" text-anchor="middle" fill="#166534" font-size="9">→ Stufe 3</text>
  
  <line x1="600" y1="375" x2="600" y2="405" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="615" y="395" fill="#475569" font-size="9">NEIN</text>
  
  <!-- ===== S2.1 HERKUNFTS-OVERRIDES ===== -->
  <rect x="100" y="415" width="1000" height="130" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="438" fill="#1e40af" font-size="13" font-weight="bold">S2.1 Herkunfts- &amp; Plattform-Overrides (Priorität)</text>
  
  <!-- S2-01 -->
  <rect x="120" y="450" width="280" height="80" rx="4" fill="white" stroke="#3b82f6"/>
  <text x="260" y="472" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">S2-01: uncoop_violation</text>
  <text x="260" y="488" text-anchor="middle" fill="#475569" font-size="9">Verbot missachtet?</text>
  <text x="140" y="510" fill="#475569" font-size="8">☐ yes → BLOCK.UNCOOP</text>
  <text x="140" y="522" fill="#475569" font-size="8">☐ no → weiter</text>
  
  <!-- S2-02 -->
  <rect x="420" y="450" width="280" height="80" rx="4" fill="white" stroke="#3b82f6"/>
  <text x="560" y="472" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">S2-02: platform_ai_optin</text>
  <text x="560" y="488" text-anchor="middle" fill="#475569" font-size="9">Plattform: KI-Opt-in?</text>
  <text x="440" y="510" fill="#475569" font-size="8">☐ yes → weiter</text>
  <text x="440" y="522" fill="#dc2626" font-size="8">☐ no → BLOCK.PLATFORM_NO_OPTIN</text>
  
  <!-- S2-03 -->
  <rect x="720" y="450" width="360" height="80" rx="4" fill="white" stroke="#3b82f6"/>
  <text x="900" y="472" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="bold">S2-03: platform_display_mode</text>
  <text x="900" y="488" text-anchor="middle" fill="#475569" font-size="9">Plattform: Darstellungsform?</text>
  <text x="740" y="510" fill="#3b82f6" font-size="8">☐ LINK_ONLY → REQ.LINK_ONLY</text>
  <text x="740" y="522" fill="#475569" font-size="8">☐ OK_COPY → weiter</text>
  
  <line x1="600" y1="545" x2="600" y2="575" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== S2.2 RECHTEKETTE ===== -->
  <rect x="300" y="585" width="600" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="608" fill="#1e40af" font-size="13" font-weight="bold">S2.2 Rechtekette / Rechteinhaber</text>
  
  <!-- S2-04 -->
  <rect x="320" y="620" width="560" height="35" rx="4" fill="white" stroke="#3b82f6"/>
  <text x="340" y="642" fill="#1e40af" font-size="10" font-weight="bold">S2-04: rights_holder_status</text>
  <text x="540" y="642" fill="#475569" font-size="9">☐ rights_holder ☐ authorized → weiter</text>
  <text x="780" y="642" fill="#dc2626" font-size="9">☐ unknown → BLOCK.RIGHTS_UNKNOWN</text>
  
  <line x1="600" y1="665" x2="600" y2="695" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== COOP CHECK ===== -->
  <polygon points="600,705 720,750 600,795 480,750" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="745" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">coop_present = yes?</text>
  <text x="600" y="765" text-anchor="middle" fill="#166534" font-size="9">Kooperationsvertrag?</text>
  
  <line x1="720" y1="750" x2="850" y2="750" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="785" y="740" fill="#166534" font-size="9">JA</text>
  
  <rect x="850" y="720" width="200" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="950" y="745" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">⏭️ S2.3-S2.5</text>
  <text x="950" y="762" text-anchor="middle" fill="#166534" font-size="9">überspringen!</text>
  <text x="950" y="776" text-anchor="middle" fill="#166534" font-size="8">Vertrag regelt Rechte</text>
  
  <line x1="600" y1="795" x2="600" y2="825" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="615" y="815" fill="#475569" font-size="9">NEIN</text>
  
  <!-- ===== S2.3-S2.5 Block (nur ohne COOP) ===== -->
  <rect x="100" y="835" width="1000" height="380" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="120" y="860" fill="#0369a1" font-size="12" font-weight="bold">S2.3-S2.5: NUR wenn coop_present ≠ yes (kein Kooperationsvertrag)</text>
  
  <!-- S2.3 Lizenz -->
  <rect x="120" y="875" width="480" height="110" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="898" fill="#1e40af" font-size="11" font-weight="bold">S2.3 Lizenz (S2-05, S2-06)</text>
  
  <rect x="140" y="910" width="200" height="60" rx="4" fill="white" stroke="#3b82f6"/>
  <text x="240" y="928" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="bold">S2-05a: license_text</text>
  <text x="150" y="945" fill="#475569" font-size="7">☐ CC0/PD ☐ CC_BY ☐ CC_BY_NC</text>
  <text x="150" y="958" fill="#475569" font-size="7">☐ Proprietary ☐ Unknown</text>
  
  <rect x="360" y="910" width="220" height="60" rx="4" fill="white" stroke="#3b82f6"/>
  <text x="470" y="928" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="bold">S2-05b: license_media</text>
  <text x="370" y="945" fill="#475569" font-size="7">☐ CC0/PD ☐ CC_BY ☐ CC_BY_NC</text>
  <text x="370" y="958" fill="#475569" font-size="7">☐ Proprietary ☐ Unknown</text>
  
  <!-- Lizenz Tags -->
  <rect x="620" y="875" width="460" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="640" y="898" fill="#92400e" font-size="10" font-weight="bold">Mögliche Tags aus Lizenz:</text>
  <text x="640" y="918" fill="#dc2626" font-size="9">Unknown → BLOCK.LICENSE_UNKNOWN</text>
  <text x="640" y="935" fill="#3b82f6" font-size="9">CC_BY → REQ.ATTRIBUTION</text>
  <text x="640" y="952" fill="#f59e0b" font-size="9">CC_BY_NC → REQ.ATTRIBUTION + LIMIT.NC_ONLY</text>
  <text x="640" y="969" fill="#f59e0b" font-size="9">Proprietary → LIMIT.DISPLAY_ONLY</text>
  
  <!-- S2-06 -->
  <rect x="120" y="995" width="300" height="45" rx="4" fill="white" stroke="#3b82f6"/>
  <text x="270" y="1015" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="bold">S2-06: mixed_licenses</text>
  <text x="130" y="1032" fill="#f59e0b" font-size="8">☐ yes → LIMIT.MIXED_TREAT_AS_UNKNOWN</text>
  
  <!-- S2.4 ToS/TDM -->
  <rect x="120" y="1050" width="960" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="1073" fill="#1e40af" font-size="11" font-weight="bold">S2.4 ToS &amp; TDM (S2-07 bis S2-10)</text>
  
  <rect x="140" y="1085" width="200" height="30" rx="3" fill="white" stroke="#3b82f6"/>
  <text x="150" y="1105" fill="#475569" font-size="8">S2-07: tos_ai_forbidden?</text>
  <text x="260" y="1105" fill="#dc2626" font-size="7">→ BLOCK.TOS_AI</text>
  
  <rect x="360" y="1085" width="200" height="30" rx="3" fill="white" stroke="#3b82f6"/>
  <text x="370" y="1105" fill="#475569" font-size="8">S2-08: tos_redist_forbidden?</text>
  <text x="495" y="1105" fill="#dc2626" font-size="7">→ BLOCK.TOS_REDIST</text>
  
  <rect x="580" y="1085" width="200" height="30" rx="3" fill="white" stroke="#3b82f6"/>
  <text x="590" y="1105" fill="#475569" font-size="8">S2-09: tdm_optout_machine?</text>
  <text x="710" y="1105" fill="#dc2626" font-size="7">→ BLOCK.TDM_OPTOUT</text>
  
  <rect x="800" y="1085" width="260" height="30" rx="3" fill="white" stroke="#3b82f6"/>
  <text x="810" y="1105" fill="#475569" font-size="8">S2-10: robots_disallow_crawl?</text>
  <text x="970" y="1105" fill="#f59e0b" font-size="7">→ LIMIT.CRAWL_DISALLOWED</text>
  
  <!-- S2.5 DB-Recht -->
  <rect x="120" y="1135" width="500" height="65" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="1158" fill="#1e40af" font-size="11" font-weight="bold">S2.5 Datenbankrecht (S2-11)</text>
  <rect x="140" y="1170" width="460" height="25" rx="3" fill="white" stroke="#3b82f6"/>
  <text x="150" y="1188" fill="#475569" font-size="9">S2-11: db_mass_extraction? Wesentliche Teile entnommen?</text>
  <text x="480" y="1188" fill="#f59e0b" font-size="9">☐ yes → LIMIT.DB_RISK_COMM</text>
  
  <!-- Arrow from COOP skip -->
  <line x1="1050" y1="750" x2="1120" y2="750" stroke="#22c55e" stroke-width="1"/>
  <line x1="1120" y1="750" x2="1120" y2="1230" stroke="#22c55e" stroke-width="1"/>
  <line x1="1120" y1="1230" x2="650" y2="1230" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="600" y1="1215" x2="600" y2="1245" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== S2.6 Derivate ===== -->
  <rect x="200" y="1255" width="800" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="220" y="1280" fill="#3730a3" font-size="12" font-weight="bold">S2.6 Derivate: Vererbungsregel (S2-12)</text>
  <text x="220" y="1300" fill="#5b21b6" font-size="10">S2-12: derived_from – Derivat abgeleitet von?</text>
  <text x="220" y="1318" fill="#475569" font-size="9">☐ FACTS ☐ TEXT ☐ MEDIA ☐ MIXED → Derivate (COMPENDIUM, QA_PAIRS, INDEX, MODEL_WEIGHTS) erben ALLE Tags!</text>
  
  <line x1="600" y1="1335" x2="600" y2="1365" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Tag Summary -->
  <rect x="150" y="1375" width="900" height="70" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="600" y="1398" text-anchor="middle" fill="#6b21a8" font-size="11" font-weight="bold">Gesetzte Tags (Zusammenfassung)</text>
  <text x="180" y="1418" fill="#dc2626" font-size="9" font-weight="bold">BLOCK:</text>
  <text x="230" y="1418" fill="#475569" font-size="8">UNCOOP | PLATFORM_NO_OPTIN | RIGHTS_UNKNOWN | LICENSE_UNKNOWN | TOS_AI | TOS_REDIST | TDM_OPTOUT</text>
  <text x="180" y="1435" fill="#f59e0b" font-size="9" font-weight="bold">LIMIT:</text>
  <text x="225" y="1435" fill="#475569" font-size="8">NC_ONLY | DISPLAY_ONLY | MIXED_TREAT_AS_UNKNOWN | CRAWL_DISALLOWED | DB_RISK_COMM</text>
  <text x="700" y="1435" fill="#3b82f6" font-size="9" font-weight="bold">REQ:</text>
  <text x="730" y="1435" fill="#475569" font-size="8">ATTRIBUTION | LINK_ONLY</text>
  
  <!-- OUTPUT -->
  <rect x="350" y="1455" width="500" height="35" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="600" y="1478" text-anchor="middle" fill="white" font-size="14" font-weight="bold">OUTPUT: Tags → STUFE 3 Matrix</text>
</svg>
