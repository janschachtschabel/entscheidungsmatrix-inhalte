<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="1200" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="url(#headerGrad)"/>
  <text x="500" y="28" text-anchor="middle" fill="white" font-size="22" font-weight="bold">STUFE 1: Intake &amp; Hygiene</text>
  <text x="500" y="48" text-anchor="middle" fill="#e0e7ff" font-size="12">Klassifizierung • PII-Prüfung • Datenpass erstellen</text>
  <text x="500" y="64" text-anchor="middle" fill="#c7d2fe" font-size="10">Keine finale Rechts- oder Use-Case-Freigabe!</text>
  
  <!-- Start -->
  <ellipse cx="500" cy="110" rx="80" ry="28" fill="#4f46e5" stroke="#3730a3" stroke-width="2"/>
  <text x="500" y="115" text-anchor="middle" fill="white" font-size="13" font-weight="bold">START</text>
  
  <!-- Arrow -->
  <line x1="500" y1="138" x2="500" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== S1.1 QUELLE ===== -->
  <rect x="300" y="175" width="400" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="195" fill="#1e40af" font-size="13" font-weight="bold">S1.1 Quelle &amp; Zugriff</text>
  <text x="320" y="212" fill="#1e40af" font-size="10">S1-01: Wie wurden die Daten erhoben?</text>
  
  <!-- Arrow -->
  <line x1="500" y1="220" x2="500" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Source Class Diamond -->
  <polygon points="500,260 620,320 500,380 380,320" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="310" text-anchor="middle" fill="#92400e" font-size="12" font-weight="bold">source_class?</text>
  <text x="500" y="330" text-anchor="middle" fill="#92400e" font-size="9">OWN/COOP/PLATFORM</text>
  <text x="500" y="345" text-anchor="middle" fill="#92400e" font-size="9">UNCOOP/UNKNOWN</text>
  
  <!-- UNCOOP Branch (left) -->
  <line x1="380" y1="320" x2="180" y2="320" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="280" y="310" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="bold">UNCOOP</text>
  
  <rect x="30" y="285" width="150" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="105" y="308" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">⛔ Z0 BLOCK</text>
  <text x="105" y="325" text-anchor="middle" fill="#dc2626" font-size="9">BLOCK.UNCOOP</text>
  <text x="105" y="345" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="bold">STOPP!</text>
  
  <!-- UNKNOWN Branch (right) -->
  <line x1="620" y1="320" x2="820" y2="320" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="720" y="310" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">UNKNOWN</text>
  
  <rect x="820" y="285" width="150" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="895" y="308" text-anchor="middle" fill="#92400e" font-size="12" font-weight="bold">⚠️ Z5 UNKLAR</text>
  <text x="895" y="325" text-anchor="middle" fill="#92400e" font-size="9">Klärung in Stufe 2</text>
  <text x="895" y="345" text-anchor="middle" fill="#92400e" font-size="9">→ weiter</text>
  
  <!-- OWN Branch -->
  <line x1="440" y1="380" x2="300" y2="420" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="350" y="400" fill="#166534" font-size="10" font-weight="bold">OWN</text>
  
  <rect x="200" y="425" width="130" height="55" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="265" y="448" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">✅ Z4 SAFE</text>
  <text x="265" y="465" text-anchor="middle" fill="#166534" font-size="9">Stufe 2 optional</text>
  
  <!-- COOP Branch -->
  <line x1="500" y1="380" x2="500" y2="420" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="515" y="400" fill="#166534" font-size="10" font-weight="bold">COOP</text>
  
  <rect x="435" y="425" width="130" height="55" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="448" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">✅ Z4 SAFE</text>
  <text x="500" y="465" text-anchor="middle" fill="#166534" font-size="9">→ S1-02 Vertrag?</text>
  
  <!-- PLATFORM Branch -->
  <line x1="560" y1="380" x2="700" y2="420" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="400" fill="#92400e" font-size="10" font-weight="bold">PLATFORM</text>
  
  <rect x="635" y="425" width="130" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="700" y="448" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">🟡 Z2 PLATFORM</text>
  <text x="700" y="465" text-anchor="middle" fill="#92400e" font-size="9">→ S1-02 Vertrag?</text>
  
  <!-- Merge -->
  <line x1="265" y1="480" x2="265" y2="510" stroke="#64748b" stroke-width="1"/>
  <line x1="500" y1="480" x2="500" y2="510" stroke="#64748b" stroke-width="1"/>
  <line x1="700" y1="480" x2="700" y2="510" stroke="#64748b" stroke-width="1"/>
  <line x1="895" y1="355" x2="895" y2="510" stroke="#64748b" stroke-width="1"/>
  <line x1="265" y1="510" x2="895" y2="510" stroke="#64748b" stroke-width="1"/>
  <line x1="500" y1="510" x2="500" y2="540" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== S1.2 KOMPONENTEN ===== -->
  <rect x="300" y="550" width="400" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="570" fill="#1e40af" font-size="13" font-weight="bold">S1.2 Komponenten-Check</text>
  <text x="320" y="587" fill="#1e40af" font-size="10">S1-03: Welche Komponenten enthält der Datensatz?</text>
  
  <!-- Arrow -->
  <line x1="500" y1="595" x2="500" y2="620" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Components Box -->
  <rect x="100" y="630" width="800" height="100" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="655" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">Basis-Komponenten &amp; Derivate</text>
  
  <!-- Basis -->
  <rect x="120" y="670" width="100" height="45" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <text x="170" y="690" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">FACTS</text>
  <text x="170" y="705" text-anchor="middle" fill="#166534" font-size="8">Metadaten</text>
  
  <rect x="230" y="670" width="100" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="280" y="690" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">TEXT</text>
  <text x="280" y="705" text-anchor="middle" fill="#92400e" font-size="8">Fließtext</text>
  
  <rect x="340" y="670" width="100" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390" y="690" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">MEDIA</text>
  <text x="390" y="705" text-anchor="middle" fill="#92400e" font-size="8">Bilder/Video</text>
  
  <!-- Derivate -->
  <rect x="470" y="670" width="90" height="45" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="515" y="690" text-anchor="middle" fill="#3730a3" font-size="8" font-weight="bold">COMPENDIUM</text>
  <text x="515" y="705" text-anchor="middle" fill="#3730a3" font-size="7">_TEXT</text>
  
  <rect x="570" y="670" width="80" height="45" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="610" y="690" text-anchor="middle" fill="#3730a3" font-size="9" font-weight="bold">QA_PAIRS</text>
  
  <rect x="660" y="670" width="70" height="45" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="695" y="690" text-anchor="middle" fill="#3730a3" font-size="9" font-weight="bold">INDEX</text>
  
  <rect x="740" y="670" width="140" height="45" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="810" y="690" text-anchor="middle" fill="#3730a3" font-size="9" font-weight="bold">MODEL_WEIGHTS</text>
  
  <!-- Arrow -->
  <line x1="500" y1="730" x2="500" y2="760" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Media Storage Check -->
  <polygon points="500,770 600,810 500,850 400,810" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="805" text-anchor="middle" fill="#92400e" font-size="10" font-weight="bold">S1-04: MEDIA?</text>
  <text x="500" y="820" text-anchor="middle" fill="#92400e" font-size="8">Speicherung?</text>
  
  <line x1="400" y1="810" x2="280" y2="810" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="800" fill="#166534" font-size="9">LINK_ONLY</text>
  
  <rect x="170" y="785" width="110" height="50" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="225" y="808" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold">REQ.LINK_ONLY</text>
  <text x="225" y="825" text-anchor="middle" fill="#166534" font-size="8">Nur verlinken</text>
  
  <line x1="600" y1="810" x2="720" y2="810" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="660" y="800" fill="#92400e" font-size="9">COPIED</text>
  
  <rect x="720" y="785" width="110" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="775" y="808" text-anchor="middle" fill="#92400e" font-size="9" font-weight="bold">→ Stufe 2</text>
  <text x="775" y="825" text-anchor="middle" fill="#92400e" font-size="8">Rechte klären</text>
  
  <!-- Merge -->
  <line x1="225" y1="835" x2="225" y2="870" stroke="#64748b" stroke-width="1"/>
  <line x1="500" y1="850" x2="500" y2="870" stroke="#64748b" stroke-width="1"/>
  <line x1="775" y1="835" x2="775" y2="870" stroke="#64748b" stroke-width="1"/>
  <line x1="225" y1="870" x2="775" y2="870" stroke="#64748b" stroke-width="1"/>
  <line x1="500" y1="870" x2="500" y2="900" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===== S1.3 PII ===== -->
  <rect x="300" y="910" width="400" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="930" fill="#1e40af" font-size="13" font-weight="bold">S1.3 Datenschutz / PII-Check</text>
  <text x="320" y="947" fill="#1e40af" font-size="10">S1-05: Personenbezogene Daten im Datensatz?</text>
  
  <!-- Arrow -->
  <line x1="500" y1="955" x2="500" y2="985" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- PII Diamond -->
  <polygon points="500,995 600,1040 500,1085 400,1040" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="1035" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">pii_status?</text>
  <text x="500" y="1055" text-anchor="middle" fill="#92400e" font-size="9">none/possible/high</text>
  
  <!-- none -->
  <line x1="400" y1="1040" x2="250" y2="1040" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="1030" fill="#166534" font-size="10">none</text>
  
  <rect x="130" y="1015" width="120" height="50" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="190" y="1038" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">✅ OK</text>
  <text x="190" y="1055" text-anchor="middle" fill="#166534" font-size="8">Keine PII</text>
  
  <!-- high -->
  <line x1="600" y1="1040" x2="750" y2="1040" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="675" y="1030" fill="#dc2626" font-size="10">high</text>
  
  <!-- S1-06 Diamond -->
  <polygon points="850,1000 930,1040 850,1080 770,1040" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="850" y="1035" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="bold">S1-06</text>
  <text x="850" y="1050" text-anchor="middle" fill="#dc2626" font-size="8">mitigiert?</text>
  
  <!-- Not mitigated -->
  <line x1="850" y1="1080" x2="850" y2="1120" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="865" y="1105" fill="#dc2626" font-size="8">NEIN</text>
  
  <rect x="770" y="1125" width="160" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="850" y="1148" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="bold">⛔ Z1 QUARANTINE</text>
  <text x="850" y="1165" text-anchor="middle" fill="#dc2626" font-size="9">BLOCK.PII_QUARANTINE</text>
  
  <!-- Mitigated -->
  <line x1="930" y1="1040" x2="980" y2="1040" stroke="#22c55e" stroke-width="2"/>
  <line x1="980" y1="1040" x2="980" y2="1100" stroke="#22c55e" stroke-width="2"/>
  <line x1="980" y1="1100" x2="600" y2="1100" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="950" y="1030" fill="#166534" font-size="8">JA</text>
  
  <!-- possible merges -->
  <line x1="500" y1="1085" x2="500" y2="1100" stroke="#f59e0b" stroke-width="2"/>
  <text x="515" y="1098" fill="#92400e" font-size="8">possible</text>
  
  <!-- Output merge -->
  <line x1="190" y1="1065" x2="190" y2="1150" stroke="#64748b" stroke-width="1"/>
  <line x1="500" y1="1100" x2="500" y2="1150" stroke="#64748b" stroke-width="1"/>
  <line x1="190" y1="1150" x2="500" y2="1150" stroke="#64748b" stroke-width="1"/>
  <line x1="500" y1="1150" x2="500" y2="1180" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- OUTPUT -->
  <rect x="250" y="1185" width="500" height="45" rx="10" fill="#4f46e5" stroke="#3730a3" stroke-width="2"/>
  <text x="500" y="1210" text-anchor="middle" fill="white" font-size="14" font-weight="bold">OUTPUT: DATENPASS → STUFE 2</text>
  
  <!-- Legend -->
  <rect x="20" y="100" width="140" height="140" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="120" fill="#475569" font-size="10" font-weight="bold">Pool-Routing</text>
  <text x="30" y="140" fill="#dc2626" font-size="9">Z0 BLOCK</text>
  <text x="30" y="155" fill="#dc2626" font-size="9">Z1 QUARANTINE</text>
  <text x="30" y="170" fill="#f59e0b" font-size="9">Z2 PLATFORM</text>
  <text x="30" y="185" fill="#22c55e" font-size="9">Z4 SAFE</text>
  <text x="30" y="200" fill="#f59e0b" font-size="9">Z5 UNKLAR</text>
  <text x="30" y="225" fill="#475569" font-size="8" font-weight="bold">Tags: BLOCK.*, REQ.*</text>
</svg>
